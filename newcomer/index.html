<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LADI · 수영로교회 고등부 찬양팀</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LADI">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="../icons/icon-152x152.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .page { display: none; }
  .page.active { display: block; }

  /* 파트 배지 */
  .part-건반 { background:#DBEAFE; color:#1e40af; }
  .part-드럼 { background:#FFE4D6; color:#9a3412; }
  .part-싱어 { background:#FEF9C3; color:#92400e; }
  .part-보컬 { background:#E5E7EB; color:#374151; }
  .part-워십 { background:#DCFCE7; color:#166534; }

  /* 출석 상태 — 본 앱과 같은 색 언어 */
  .st-출석 { background:#DBEAFE; color:#1D4ED8; font-weight:600; }
  .st-지각 { background:#FEF9C3; color:#B45309; font-weight:600; }
  .st-무단지각 { background:#FDBA74; color:#7C2D12; font-weight:700; }
  .st-결석 { background:#FEE2E2; color:#DC2626; font-weight:600; }
  .st-무단결석 { background:#F87171; color:#7F1D1D; font-weight:700; }
  .st-빈칸 { background:#F9FAFB; color:#9CA3AF; }

  .gate-O { background:#DCFCE7; color:#166534; font-weight:700; }
  .gate-X { background:#FEE2E2; color:#DC2626; font-weight:700; }

  /* 신호등 */
  .sig-green  { background:#DCFCE7; color:#166534; }
  .sig-yellow { background:#FEF9C3; color:#B45309; }
  .sig-red    { background:#FEE2E2; color:#B91C1C; }

  .check-cell {
    min-width: 38px; min-height: 38px; text-align:center; padding:2px;
    font-size:13px; border-radius:6px; cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .qt-dot {
    width:30px; height:30px; border-radius:8px; font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    border:1px solid #E5E7EB; background:#F9FAFB; color:#9CA3AF;
  }
  .qt-dot.on { background:#DBEAFE; border-color:#93C5FD; color:#1D4ED8; }

  .nav-btn.active svg { stroke:#111827; }
  .nav-btn.active span { color:#111827; }
  .scroll-table { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table th, table td { white-space:nowrap; }

  #login-screen { display:flex; }
  .pin-input { letter-spacing:0.5em; font-size:1.5rem; text-align:center; }

  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
  .modal.open { display:flex; }

  input[type="text"], input[type="date"], input[type="tel"], select, textarea {
    border:1px solid #D1D5DB; border-radius:8px; padding:8px 12px; font-size:14px; width:100%; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:#111827; box-shadow:0 0 0 2px rgba(17,24,39,0.15); }
  button, .btn { min-height:44px; }
  .nav-btn { min-height:unset; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04); padding:16px; }

  /* ── LADI 소개 ── */
  #page-about { background:#000; color:#fff; margin:-3.5rem 0 -5rem; padding:3.5rem 0 5rem; }
  .ab { padding:0 22px; max-width:520px; margin:0 auto; }
  .ab-sec { padding:54px 0; border-top:1px solid rgba(255,255,255,.10); }
  .ab-sec:first-child { border-top:0; }
  .ab-kicker { font-size:11px; letter-spacing:.28em; color:rgba(255,255,255,.42); font-weight:700; margin-bottom:14px; }
  .ab h2 { font-size:23px; font-weight:800; letter-spacing:-.01em; line-height:1.3; margin:0 0 14px; color:#fff; }
  .ab p { font-size:15px; line-height:1.85; color:rgba(255,255,255,.80); margin:0 0 14px; }
  .ab p.lead { font-size:17px; color:#fff; font-weight:600; line-height:1.75; }
  .ab .dim { color:rgba(255,255,255,.45); }
  .ab .hl { color:#fff; font-weight:700; }

  /* 십자가 타이포 — 이미지 대신 글자로 그린다(어느 화면에서도 또렷하게) */
  .cross { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:18px 0 8px; }
  .cross .ln { position:relative; display:flex; justify-content:center; width:100%; height:38px; align-items:center; }
  .cross .ch { font-size:34px; font-weight:300; letter-spacing:.02em; line-height:1; width:34px; text-align:center; display:inline-block; }
  .cross .arm { position:absolute; top:50%; transform:translateY(-50%); display:flex; }
  .cross .arm.l { right:calc(50% + 17px); }
  .cross .arm.r { left:calc(50% + 17px); }
  .cross .waves { position:absolute; left:calc(50% + 58px); top:50%; transform:translateY(-50%);
                  font-size:9px; font-weight:800; line-height:1.4; letter-spacing:.06em; text-align:left; color:#fff; }
  .ladi-mark { font-size:44px; font-weight:900; letter-spacing:.10em; text-align:center; margin-top:26px; color:#fff; }
  .ladi-sub { text-align:center; font-size:11px; letter-spacing:.34em; color:rgba(255,255,255,.5); margin-top:8px; font-weight:700; }

  .chant { text-align:center; padding:6px 0 2px; }
  .chant .c1 { font-size:17px; font-weight:800; line-height:1.9; color:#fff; }
  .chant .c2 { font-size:13px; letter-spacing:.22em; color:rgba(255,255,255,.5); margin-top:12px; font-weight:700; }
  .chant .c3 { font-size:30px; font-weight:900; letter-spacing:.14em; margin-top:2px; color:#fff; }

  .sched { border-left:2px solid rgba(255,255,255,.16); margin-left:6px; padding-left:16px; }
  .sched .it { padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); display:flex; gap:10px; align-items:baseline; }
  .sched .it:last-child { border-bottom:0; }
  .sched .tm { font-size:11px; color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:88px; font-weight:600; }
  .sched .nm { font-size:14px; color:rgba(255,255,255,.9); }

  .part { padding:20px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .part:last-child { border-bottom:0; }
  .part .pn { font-size:21px; font-weight:900; letter-spacing:.03em; color:#fff; }
  .part .pe { font-size:10px; letter-spacing:.26em; color:rgba(255,255,255,.42); font-weight:700; margin-top:3px; }
  .part .pd { font-size:14px; color:rgba(255,255,255,.75); line-height:1.75; margin-top:8px; }

  .steps { counter-reset:st; }
  .steps .st { position:relative; padding:11px 0 11px 34px; font-size:14.5px; color:rgba(255,255,255,.85); }
  .steps .st::before { counter-increment:st; content:counter(st); position:absolute; left:0; top:11px;
    width:21px; height:21px; border-radius:50%; border:1px solid rgba(255,255,255,.3);
    font-size:10px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.6); font-weight:700; }
  .steps .st.last { color:#fff; font-weight:800; }
  .steps .st.last::before { background:#fff; color:#000; border-color:#fff; }
</style>
</head>
<body class="bg-gray-50">

<header class="text-white px-4 py-3 fixed top-0 left-0 right-0 z-50 shadow-md" style="background:#0B0B0C">
  <div class="flex items-center justify-between max-w-2xl mx-auto">
    <h1 class="text-lg font-bold cursor-pointer active:opacity-70" onclick="navigate('home')">LADI</h1>
    <div class="flex items-center gap-2">
      <div id="header-week" class="text-sm px-3 py-1 rounded-full" style="background:rgba(255,255,255,.12)"></div>
      <button onclick="openModal('modal-user-menu')" class="flex items-center gap-1 px-2.5 py-1 rounded-full text-sm" style="background:rgba(255,255,255,.12)">
        <span id="header-user-name" class="text-xs max-w-20 truncate"></span>
      </button>
    </div>
  </div>
</header>

<main class="pt-14 pb-20 max-w-2xl mx-auto" id="main-content">
  <div id="page-home" class="page active p-4 space-y-4"></div>
  <div id="page-qt" class="page p-4 space-y-4"></div>
  <div id="page-check" class="page p-4 space-y-4"></div>
  <div id="page-status" class="page p-4 space-y-4"></div>
  <div id="page-roster" class="page p-4 space-y-4"></div>
  <div id="page-intro" class="page p-4 space-y-4"></div>
  <div id="page-rules" class="page p-4 space-y-4"></div>
  <div id="page-about" class="page"></div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 shadow-lg">
  <div class="flex justify-around items-center max-w-2xl mx-auto py-1">
    <button class="nav-btn active flex flex-col items-center py-1 px-2" onclick="navigate('home')" id="nav-home">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">홈</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2" onclick="navigate('qt')" id="nav-qt">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">큐티</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2" onclick="navigate('check')" id="nav-check">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">체크표</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2" onclick="navigate('status')" id="nav-status">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">수료현황</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2 hidden" onclick="navigate('roster')" id="nav-roster">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">명단</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2 hidden" onclick="navigate('intro')" id="nav-intro">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M13 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">자소서</span>
    </button>
    <button class="nav-btn flex flex-col items-center py-1 px-2" onclick="navigate('rules')" id="nav-rules">
      <svg class="w-6 h-6 stroke-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      <span class="text-xs mt-0.5 font-medium text-gray-500">기준</span>
    </button>
  </div>
</nav>

<!-- Login -->
<div id="login-screen" class="fixed inset-0 z-[300] flex items-center justify-center bg-black">
  <div id="build-badge" class="absolute bottom-4 left-0 right-0 text-center text-[11px] text-white/40/70 select-text"></div>
  <div class="bg-white rounded-3xl w-full max-w-sm mx-4 overflow-hidden shadow-2xl">
    <div class="bg-black p-6 text-center">
      <div class="text-4xl mb-2">🌱</div>
      <h1 class="text-xl font-bold text-white">수영로 LADI</h1>
      <p class="text-white/70 text-sm mt-1">8주 수료 과정</p>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="text-xs text-gray-500 font-semibold mb-1 block">이름 선택</label>
        <select id="login-name-select" class="w-full border rounded-xl p-3 text-sm">
          <option value="">이름을 선택하세요</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 font-semibold mb-1 block">PIN 번호 (4자리)</label>
        <input type="password" id="login-pin" maxlength="4" inputmode="numeric" placeholder="● ● ● ●"
               class="pin-input w-full border rounded-xl p-3" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <p id="login-error" class="text-xs text-red-500 text-center hidden">PIN 번호가 올바르지 않습니다</p>
      <button onclick="doLogin()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">로그인</button>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
        <p class="text-xs text-amber-800 leading-relaxed">처음 PIN은 <b>0000</b>입니다.
        누구나 눌러볼 수 있는 번호이니 <b>로그인하면 꼭 바꿔주세요.</b> 계정 메뉴 → PIN 번호 변경.</p>
      </div>
    </div>
  </div>
</div>

<!-- 지면 크게 보기 -->
<div id="modal-img" class="modal" onclick="closeModal('modal-img')">
  <div class="flex items-center justify-center w-full h-full p-3">
    <img id="modal-img-src" src="" class="max-w-full max-h-[92vh] rounded-xl object-contain shadow-2xl">
  </div>
</div>

<!-- User menu -->
<div id="modal-user-menu" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b">
      <p class="font-bold text-gray-800" id="user-menu-name">내 계정</p>
      <p class="text-xs text-gray-500 mt-0.5" id="user-menu-role"></p>
    </div>
    <div class="p-2">
      <button onclick="closeModal('modal-user-menu');openModal('modal-pin')" class="w-full text-left px-4 py-3 text-sm text-gray-700 rounded-xl active:bg-gray-50">🔐 PIN 번호 변경</button>
      <button id="btn-settings" onclick="closeModal('modal-user-menu');openModal('modal-settings')" class="w-full text-left px-4 py-3 text-sm text-gray-700 rounded-xl active:bg-gray-50 hidden">📅 과정 시작일 설정</button>
      <button onclick="doLogout()" class="w-full text-left px-4 py-3 text-sm text-red-600 rounded-xl active:bg-gray-50">로그아웃</button>
      <button onclick="closeModal('modal-user-menu')" class="w-full text-left px-4 py-3 text-sm text-gray-400 rounded-xl active:bg-gray-50">닫기</button>
    </div>
  </div>
</div>

<!-- PIN change -->
<div id="modal-pin" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">PIN 변경</h3>
      <button onclick="closeModal('modal-pin')" class="text-gray-400 text-2xl leading-none">×</button>
    </div>
    <div class="p-4 space-y-3">
      <div><label class="text-xs text-gray-500 font-semibold mb-1 block">현재 PIN</label>
        <input type="password" id="pin-current" maxlength="4" inputmode="numeric" placeholder="● ● ● ●" class="pin-input w-full border rounded-xl p-3"></div>
      <div><label class="text-xs text-gray-500 font-semibold mb-1 block">새 PIN</label>
        <input type="password" id="pin-new" maxlength="4" inputmode="numeric" placeholder="● ● ● ●" class="pin-input w-full border rounded-xl p-3"></div>
      <p id="pin-error" class="text-xs text-red-500 hidden text-center"></p>
    </div>
    <div class="p-4 pt-0 flex gap-2">
      <button onclick="doChangePIN()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">변경</button>
      <button onclick="closeModal('modal-pin')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">취소</button>
    </div>
  </div>
</div>

<!-- Settings (leader) -->
<div id="modal-settings" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">과정 시작일</h3>
      <button onclick="closeModal('modal-settings')" class="text-gray-400 text-2xl leading-none">×</button>
    </div>
    <div class="p-4 space-y-2">
      <p class="text-xs text-gray-500 leading-relaxed">8주 과정이 시작하는 <b>첫 토요일</b>을 고르세요. 한 주차는 토요일부터 다음 금요일까지입니다(토·주일 출석 + 이어지는 월~금 큐티).</p>
      <input type="date" id="set-start-date">
      <p id="settings-preview" class="text-xs text-gray-700 font-semibold"></p>
    </div>
    <div class="p-4 pt-0 flex gap-2">
      <button onclick="doSaveStartDate()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">저장</button>
      <button onclick="closeModal('modal-settings')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">취소</button>
    </div>
  </div>
</div>

<!-- 자기소개서 보기 — 팀장 전용 -->
<div id="modal-intro" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col">
    <div class="p-4 border-b flex items-center justify-between">
      <div class="min-w-0">
        <p id="intro-title" class="font-bold text-gray-800"></p>
        <p id="intro-sub" class="text-xs text-gray-500 mt-0.5 truncate"></p>
      </div>
      <button onclick="closeModal('modal-intro')" style="min-height:32px" class="text-gray-400 text-xl px-2">&times;</button>
    </div>
    <div id="intro-body" class="p-4 overflow-y-auto flex-1"></div>
    <div class="p-4 pt-0 flex gap-2">
      <button id="intro-download" onclick="downloadIntro()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">내려받기</button>
      <button onclick="closeModal('modal-intro')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">닫기</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// 기본 정보
// ==========================================
// sw.js의 APP_BUILD와 반드시 같은 값이어야 한다. 배포할 때 둘 다 올린다.
const APP_BUILD = '2026-08-31.2';
const WEEKS = 8;
const DEFAULT_START = '2026-09-05'; // 첫 토요일 — 리더가 앱에서 바꿀 수 있다

// 명단. 연락처는 여기 두지 않는다(공개 저장소에 남으므로) — Firestore에서 받아 온다.
const ROSTER = [
  // 2026-08-31 목사님 지시로 김채은(n01)·이예빛(n02)·이윤주(n08)를 뺐다.
  // id는 다시 쓰지 않는다 — 서버에 남은 그 아이들의 기록과 섞이지 않도록.
  { id:'n03', name:'남예진', part:'싱어', gender:'여' },
  { id:'n04', name:'배은채', part:'싱어', gender:'여' },
  { id:'n05', name:'이태관', part:'싱어', gender:'남' },
  { id:'n06', name:'김루아', part:'싱어', gender:'여' },

// 바뀐 키만 서버에 병합한다. 문서 전체를 덮어쓰지 않으므로
// 두 사람이 동시에 체크해도 서로의 입력을 지우지 않는다.
let _pendingPatch = null, _patchTimer = null, _saveRetry = 0;
function pushPatch(patch) {
  Object.assign(state, mergeDeep(state, patch));
  saveLocal();
  if (!_FS_OK) return;
  _pendingPatch = mergeDeep(_pendingPatch || {}, patch);
  clearTimeout(_patchTimer);
  _patchTimer = setTimeout(flushPatch, 400);
}
function flushPatch() {
  if (!_pendingPatch) return;
  const payload = Object.assign({ schemaVersion: 1 }, _pendingPatch);
  _pendingPatch = null;
  _stateRef.set(payload, { merge: true })
    .then(() => { _saveRetry = 0; })
    .catch(e => {
      // 저장 실패를 조용히 버리지 않는다 — 다시 큐에 넣고 재시도한다.
      console.warn('저장 실패 — 재시도합니다:', e);
      _pendingPatch = mergeDeep(payload, _pendingPatch || {});
      delete _pendingPatch.schemaVersion;
      _saveRetry++;
      setTimeout(flushPatch, Math.min(1500 * _saveRetry, 15000));
    });
}
function mergeDeep(base, patch) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(patch || {}).forEach(k => {
    const v = patch[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) {
      out[k] = mergeDeep(out[k], v);
    } else {
      out[k] = v;
    }
  });
  return out;
}

let _fsTries = 0;
function initFirestore() {
  if (!_FS_OK) return;
  _stateRef.get().then(doc => {
    if (doc.exists) {
      applyRemote(doc.data());
    } else {
      // 첫 실행 — 명단을 서버에 올린다
      _stateRef.set(Object.assign({}, state)).catch(e => console.warn('초기 업로드 실패:', e));
    }
    _stateRef.onSnapshot(d => {
      if (!d.exists) return;
      applyRemote(d.data());
      // 아이가 큐티를 쓰는 중이면 화면을 다시 그리지 않는다 — 쓰던 글이 흔들리지 않도록.
      const ta = document.getElementById('qt-text');
      if (ta && document.activeElement === ta) return;
      renderAll();
    }, e => console.warn('실시간 동기화 끊김:', e));
    renderAll();
  }).catch(e => {
    _fsTries++;
    console.warn(`Firestore 연결 실패 — ${_fsTries}번째 재시도 예정:`, e);
    setTimeout(initFirestore, Math.min(2000 * _fsTries, 20000));
  });
}
function applyRemote(data) {
  ['startDate','pins','eduExempt','att','qt','gate','edu','memos'].forEach(k => {
    if (data[k] !== undefined) state[k] = data[k];
  });
  if (Array.isArray(data.students) && data.students.length) {
    // 서버 명단을 기준으로 하되, 코드에 있는 명단이 더 최신이면 빠진 사람을 채운다.
    const byId = {};
    data.students.forEach(s => { byId[s.id] = s; });
    state.students = ROSTER.map(r => Object.assign({}, r, byId[r.id] || {}));
  }
  saveLocal();
}

// 날짜 · 주차
// ==========================================
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmt(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function today0() { const t = new Date(); t.setHours(0,0,0,0); return t; }

// 한 주차 = 토요일부터 다음 금요일까지 7일. 토·주일 출석, 이어지는 월~금이 큐티.
function weekInfo(n) {
  const sat = addDays(parseDate(state.startDate || DEFAULT_START), n*7);
  return { n, sat, sun: addDays(sat,1), qtStart: addDays(sat,2), fri: addDays(sat,6) };
}
function weekStarted(n) { return today0() >= weekInfo(n).sat; }
function weekEnded(n) { return today0() > weekInfo(n).fri; }
function currentWeek() {
  for (let n = 0; n < WEEKS; n++) if (!weekEnded(n)) return n;
  return WEEKS - 1;
}

// ==========================================
// 집계 · 수료 판정
// ==========================================
function attOf(id, n, day) { return state.att[`${id}_w${n}_${day}`] || ''; }
function qtOf(id, n) { const v = state.qt[`${id}_w${n}`]; return Array.isArray(v) ? v : [false,false,false,false,false]; }
function qtCount(id, n) { return qtOf(id, n).filter(Boolean).length; }
function qtHasEntry(id, n) { return state.qt[`${id}_w${n}`] !== undefined; }
function gateOf(id, n) { return state.gate[`${id}_w${n}`] || ''; }
function eduOf(id, n) { return (state.edu || {})[`${id}_w${n}`] || ''; }

function tally(id) {
  const t = { 지각:0, 무단지각:0, 결석:0, 무단결석:0, 큐티미달:0, 가테미통과:0,
              출석:0, 미입력출석:0, 큐티미입력:0, 가테미입력:0, 교육불참:0, 교육미입력:0 };
  for (let n = 0; n < WEEKS; n++) {
    ['sat','sun'].forEach(day => {
      const v = attOf(id, n, day);
      if (v) t[v]++;
      else if (weekStarted(n)) t.미입력출석++;
    });
    // 끝난 주차만 판정한다. 기록이 아예 없는 주차는 '미입력'으로 따로 세고 판정에서 뺀다
    // — 리더가 아직 못 넣은 것을 아이 잘못으로 만들지 않기 위해서다.
    if (weekEnded(n)) {
      if (qtHasEntry(id, n)) { if (qtCount(id, n) < 4) t.큐티미달++; }
      else t.큐티미입력++;
      const g = gateOf(id, n);
      if (g === 'X') t.가테미통과++;
      else if (!g) t.가테미입력++;
      if (!isEduExempt(id, n)) {
        const e = eduOf(id, n);
        if (e === 'X') t.교육불참++;
        else if (!e) t.교육미입력++;
      }
    }
  }
  return t;
}

// 신호등: red = 수료 불가, yellow = 수료 연기 또는 한 번 남음, green = 이상 없음
function verdict(id) {
  const t = tally(id);
  const fails = [], warns = [];
  Object.keys(LIMITS).forEach(k => {
    const lim = LIMITS[k], c = t[k];
    if (c >= lim.fail) fails.push(`${lim.label} ${c}회 (${lim.fail}회부터 수료 불가)`);
    // c > 0 조건이 없으면 '1회부터 불가'인 무단결석 때문에 아무 일 없는 아이에게도 경고가 붙는다.
    else if (c > 0 && c === lim.fail - 1) warns.push(`${lim.label} ${c}회 — 한 번 더면 수료 불가`);
  });
  const hold = t.결석 === 1;
  if (fails.length) return { level:'red', label:'수료 불가', tally:t, fails, warns };
  // 결석 1회는 '연기'라는 더 강한 말로 이미 알리므로, 같은 내용의 경고를 겹쳐 쓰지 않는다.
  if (hold) return { level:'yellow', label:'수료 연기', tally:t, fails,
                     warns: ['결석 1회 — 수료가 연기됩니다'].concat(warns.filter(w => !w.startsWith('결석'))) };
  if (warns.length) return { level:'yellow', label:'주의', tally:t, fails, warns };
  return { level:'green', label:'이상 없음', tally:t, fails, warns };
}

// 날짜 → 몇 주차 며칠째 큐티인지. 토·주일이나 과정 밖 날짜면 null.
function qtSlotOf(dateISO) {
  const diff = Math.round((parseDate(dateISO) - parseDate(state.startDate || DEFAULT_START)) / 86400000);
  if (diff < 0) return null;
  const n = Math.floor(diff / 7), i = (diff % 7) - 2; // 0=토, 1=주일, 2~6=월~금
  if (n >= WEEKS || i < 0) return null;
  return { n, i };
}
function qtDateOf(n, i) { return iso(addDays(weekInfo(n).sat, 2 + i)); }
function shiftQtDate(step) {
  const s = qtSlotOf(qtDate);
  if (!s) return;
  let n = s.n, i = s.i + step;
  if (i > 4) { n++; i = 0; }
  if (i < 0) { n--; i = 4; }
  if (n < 0 || n >= WEEKS) return;
  qtDate = qtDateOf(n, i);
  renderAll();
}

// state 문서에 같이 넣으면 문서가 금방 커진다. 별도 컬렉션에 하루치씩 따로 둔다.
const _qtDocs = {};            // `${id}_${date}` → {text, image} | null
const _qtLoading = {};
let _qtPendingImg = null;      // 아직 안 올린 사진(미리보기용)

function qtKey(id, date) { return `${id}_${date}`; }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadQtDoc(id, date) {
  const k = qtKey(id, date);
  if (_qtDocs[k] !== undefined || _qtLoading[k]) return;
  if (!_FS_OK) { _qtDocs[k] = null; return; }
  _qtLoading[k] = true;
  _db.collection('newcomerQT').doc(k).get()
    .then(d => { _qtDocs[k] = d.exists ? d.data() : null; })
    .catch(e => { console.warn('큐티 불러오기 실패:', e); _qtDocs[k] = null; })
    .then(() => { delete _qtLoading[k]; renderAll(); });
}

// 사진은 폰 원본 그대로면 너무 커서 저장이 거부된다. 긴 변 1000px·품질을 낮춰 줄인다.
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onerror = () => cb(null);
  reader.onload = e => {
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      try {
        const max = 1000, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.72, out = c.toDataURL('image/jpeg', q);
        while (out.length > 420000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        cb(out.length > 700000 ? null : out);
      } catch (_) { cb(null); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function pickQtImage(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  toast('사진을 줄이는 중이에요…');
  compressImage(f, dataUrl => {
    if (!dataUrl) { toast('사진이 너무 커요. 다른 사진으로 해볼래요?'); return; }
    _qtPendingImg = dataUrl;

}

  const doc = { studentId: id, date, text, image, updatedAt: new Date().toISOString() };

  _qtDocs[qtKey(id, date)] = doc;

          <tbody>
            ${list.map(s => {

                <td class="px-2 py-2 font-semibold text-gray-800">${s.name}</td>
                <td class="px-1 py-2 text-center"><span class="sig-${v.level} px-2 py-1 rounded-full font-bold text-[11px]">${short}</span></td>
                ${cell('지각')}${cell('무단지각')}${cell('결석')}${cell('무단결석')}${cell('큐티미달')}${cell('가테미통과')}
                <td class="px-2 py-2 text-center ${t.교육불참 ? 'text-gray-600 font-semibold' : 'text-gray-300'}">${t.교육불참}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-[11px] text-gray-400 px-3 py-2 border-t">무지=무단지각 · 무결=무단결석 · 큐티=4일 미만 주차 · 가테=미통과<br>교육=토요일 교육 불참 횟수 (기록만 하고 수료 판정에는 넣지 않습니다)</p>
    </div>
    <div class="card">
      <h3 class="font-bold text-gray-800 text-sm mb-2">아직 안 채워진 곳</h3>
      ${(() => {
        // 12명이 똑같은 문장으로 도배되지 않도록, 같은 상태끼리 묶어서 한 줄로 보여준다.
        const groups = {};
        list.forEach(s => {
          const t = tally(s.id);
          const parts = [];
          if (t.미입력출석) parts.push(`출석 ${t.미입력출석}칸`);
          if (t.큐티미입력) parts.push(`큐티 ${t.큐티미입력}주`);
          if (t.가테미입력) parts.push(`가테 ${t.가테미입력}주`);
          if (t.교육미입력) parts.push(`교육 ${t.교육미입력}주`);

        return `<ul>${keys.map(k => {
          const who = groups[k];

                      : (who.length > 4 ? `${who.slice(0,4).join(', ')} 외 ${who.length-4}명` : who.join(', '));

// ── 자기소개서 (팀장 전용) ──
// 아이 한 명당 파일 하나. 문서 1MB 한도가 있으므로 base64를 조각내어
// newcomerIntro/{id}(메타) + newcomerIntro/{id}_c{n}(조각)으로 나눠 담는다.
// 큐티 제출물과 같은 이유로 state 문서에는 넣지 않는다.
const INTRO_CHUNK = 700000;    // 조각 하나의 base64 글자 수 — 문서가 1MB를 넘지 않도록
const INTRO_MAX_CHUNKS = 10;   // 원본 약 5MB까지 받는다

const _introMeta = {};      // id → meta | null(없음) | undefined(아직 안 읽음)
const _introLoading = {};
let _introOpen = null;      // 지금 모달에 띄운 파일 {id, name, fileName, mime, blobUrl}

function fileSize(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
}

function loadIntro(id) {
  if (_introMeta[id] !== undefined || _introLoading[id]) return;
  if (!_FS_OK) { _introMeta[id] = null; return; }
  _introLoading[id] = true;
  _db.collection('newcomerIntro').doc(id).get()
    .then(d => { _introMeta[id] = d.exists ? d.data() : null; })
    .catch(e => { console.warn('자기소개서 정보 불러오기 실패:', e); _introMeta[id] = null; })
    .then(() => { delete _introLoading[id]; renderAll(); });
}

// 손으로 쓴 글씨가 읽혀야 하므로 큐티 사진(긴 변 1000px)보다 크게 남긴다.
function compressIntroImage(file, cb) {
  const reader = new FileReader();
  reader.onerror = () => cb(null);
  reader.onload = e => {
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      try {
        const max = 1600, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.82));
      } catch (_) { cb(null); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function pickIntro(input, id) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!isLeader()) return;   // 올리는 것도 보는 것도 팀장만
  if (/^image\//.test(f.type)) {
    toast('사진을 줄이는 중이에요…');
    compressIntroImage(f, dataUrl => {
      if (!dataUrl) { toast('사진을 읽지 못했어요. 다른 파일로 해볼래요?'); return; }
      saveIntro(id, f.name || '자기소개서.jpg', 'image/jpeg', dataUrl.split(',')[1] || '');
    });
    return;
  }
  // 사진이 아닌 것(pdf·hwp·doc·pages 등)은 손대지 않고 그대로 담는다.
  const r = new FileReader();
  r.onerror = () => toast('파일을 읽지 못했어요');
  r.onload = e => saveIntro(id, f.name || '자기소개서',
                            f.type || 'application/octet-stream',
                            String(e.target.result).split(',')[1] || '');
  r.readAsDataURL(f);
}

function saveIntro(id, fileName, mime, b64) {
  if (!b64) { toast('파일이 비어 있어요'); return; }
  if (!_FS_OK) { toast('인터넷이 없어 올리지 못했어요'); return; }
  const chunks = [];
  for (let i = 0; i < b64.length; i += INTRO_CHUNK) chunks.push(b64.slice(i, i + INTRO_CHUNK));
  if (chunks.length > INTRO_MAX_CHUNKS) {
    toast(`파일이 너무 커요(약 ${fileSize(b64.length * 3 / 4)}). 5MB 아래로 줄여서 올려주세요`);
    return;
  }
  const prev = _introMeta[id] || {};
  const meta = {
    studentId: id, fileName, mime,
    size: Math.round(b64.length * 3 / 4),
    chunks: chunks.length,
    uploadedBy: (findUser(currentUser) || {}).name || '',
    updatedAt: new Date().toISOString()
  };
  toast('올리는 중이에요…');
  const col = _db.collection('newcomerIntro');
  const writes = chunks.map((c, i) => col.doc(`${id}_c${i}`).set({ data: c }));
  // 전에 올린 파일이 더 길었다면 남는 조각을 비운다(규칙상 삭제가 막혀 있어 덮어쓴다).
  for (let i = chunks.length; i < (prev.chunks || 0); i++) writes.push(col.doc(`${id}_c${i}`).set({ data: '' }));
  // 조각을 다 쓴 뒤에 메타를 쓴다 — 중간에 끊겨도 메타가 반쪽 파일을 가리키지 않도록.
  Promise.all(writes)
    .then(() => col.doc(id).set(meta))
    .then(() => { _introMeta[id] = meta; renderAll(); toast('자기소개서를 올렸어요'); })
    .catch(e => { console.warn('자기소개서 저장 실패:', e); toast('저장이 안 됐어요. 잠시 뒤 다시 해주세요'); });
}

function openIntro(id) {
  if (!isLeader()) return;
  const meta = _introMeta[id];
  if (!meta) return;
  const s = state.students.find(x => x.id === id) || {};
  const body = document.getElementById('intro-body');
  document.getElementById('intro-title').textContent = `${s.name} 자기소개서`;
  document.getElementById('intro-sub').textContent =
    `${meta.fileName} · ${fileSize(meta.size)}` + (meta.uploadedBy ? ` · ${meta.uploadedBy} 올림` : '');
  body.innerHTML = '<p class="text-sm text-gray-400 text-center py-10">불러오는 중이에요…</p>';
  openModal('modal-intro');

  const col = _db.collection('newcomerIntro');
  Promise.all(Array.from({ length: meta.chunks }, (_, i) => col.doc(`${id}_c${i}`).get()))
    .then(docs => {
      const b64 = docs.map(d => (d.exists ? (d.data().data || '') : '')).join('');
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (_introOpen && _introOpen.blobUrl) URL.revokeObjectURL(_introOpen.blobUrl);
      const blobUrl = URL.createObjectURL(new Blob([bytes], { type: meta.mime }));
      _introOpen = { id, name: s.name, fileName: meta.fileName, mime: meta.mime, blobUrl };
      if (/^image\//.test(meta.mime)) {
        body.innerHTML = `<img src="${blobUrl}" class="w-full rounded-xl">`;
      } else if (meta.mime === 'application/pdf') {
        body.innerHTML = `<iframe src="${blobUrl}" class="w-full rounded-xl border" style="height:60vh"></iframe>`;
      } else {
        // 한글·워드·페이지스는 브라우저가 못 여는 형식이라 내려받아 보게 한다.
        body.innerHTML = `<p class="text-sm text-gray-500 text-center py-10">앱에서 바로 볼 수 없는 형식이에요.<br>아래 <b>내려받기</b>를 눌러 열어보세요.</p>`;
      }
    })
    .catch(e => {
      console.warn('자기소개서 불러오기 실패:', e);
      body.innerHTML = '<p class="text-sm text-red-500 text-center py-10">불러오지 못했어요. 잠시 뒤 다시 열어주세요.</p>';
    });
}

  if (!_introOpen) return;

  a.download = _introOpen.fileName || `${_introOpen.name}_자기소개서`;

}

        아직 끝나지 않은 주차와 기록이 비어 있는 주차는 판정에서 빼둡니다.
      </p>
    </div>`;
}

// ==========================================
// 작은 도구들
// ==========================================
function openModal(id) {
  if (id === 'modal-settings') {
    document.getElementById('set-start-date').value = state.startDate || DEFAULT_START;
    updateSettingsPreview();
  }
  document.getElementById(id).classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function updateSettingsPreview() {
  const v = document.getElementById('set-start-date').value;
  const p = document.getElementById('settings-preview');
  if (!v) { p.textContent = ''; return; }
  const d = parseDate(v);
  if (d.getDay() !== 6) { p.textContent = '⚠️ 토요일이 아닙니다'; return; }
  p.textContent = `1주차 ${fmt(d)}(토) ~ 8주차 ${fmt(addDays(d, 7*7+6))}(금)`;
}
function toast(msg, ms) {
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:99999;max-width:88%;background:rgba(30,30,40,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, ms || 2400);
}
// 어떤 예외가 나도 앱이 통째로 멈추지 않게 한다.
// PC에서 ESC를 누르면 열려 있는 팝업이 닫힌다.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = document.querySelectorAll('.modal.open');
  if (!open.length) return;
  e.preventDefault();
  open.forEach(m => m.classList.remove('open'));
});
window.addEventListener('error', e => console.warn('[전역오류]', e.error || e.message));
window.addEventListener('unhandledrejection', e => console.warn('[전역오류:promise]', e.reason));

// ==========================================
// 시작
// ==========================================
try {
  const _badge = document.getElementById('build-badge');
  if (_badge) _badge.textContent = 'v' + APP_BUILD;
  window.APP_BUILD = APP_BUILD;
} catch (_) {}

document.getElementById('set-start-date').addEventListener('change', updateSettingsPreview);

loadLocal();
// 코드의 명단이 저장본보다 최신이면 빠진 사람을 채운다
state.students = ROSTER.map(r => Object.assign({}, r, (state.students || []).find(s => s.id === r.id) || {}));
fillLoginSelect();
checkWeek = currentWeek();
// 큐티 화면은 오늘 자로 연다. 오늘이 토·주일이면 그 주 월요일부터.
qtDate = qtSlotOf(iso(today0())) ? iso(today0()) : qtDateOf(currentWeek(), 0);

try {
  const saved = localStorage.getItem('ladi_newcomer_user');
  if (saved && findUser(saved)) {
    currentUser = saved;
    document.getElementById('login-screen').style.display = 'none';
    renderAll();
  }
} catch (_) {}

initFirestore();

// ==========================================
// 앱 자동 업데이트 (본 앱과 같은 방식 — 새로고침 루프 차단 포함)
// ==========================================
if ('serviceWorker' in navigator) {
  let _reloading = false;
  const _hadController = !!navigator.serviceWorker.controller;
  const _RELOAD_LOG_KEY = 'ladi_newcomer_auto_reloads';

  function _reloadHistory() {
    try { return JSON.parse(sessionStorage.getItem(_RELOAD_LOG_KEY) || '[]'); } catch (_) { return []; }
  }
  function _noteReload(to) {
    try {
      const log = _reloadHistory().concat({ t: Date.now(), from: APP_BUILD, to }).slice(-5);
      sessionStorage.setItem(_RELOAD_LOG_KEY, JSON.stringify(log));
    } catch (_) {}
  }
  async function _serverBuild() {
    try {
      const res = await fetch('./sw.js?ts=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      const m = (await res.text()).match(/APP_BUILD\s*=\s*['"]([^'"]+)['"]/);
      return m ? m[1] : null;
    } catch (_) { return null; }
  }
  // 큐티/체크를 누르고 아직 서버에 못 올렸으면 새로고침을 미룬다.
  function _safeToReload() {
    if (_pendingPatch) return false;                 // 서버에 아직 못 올린 체크가 있음
    if (_qtPendingImg) return false;                 // 고른 사진을 아직 안 올림
    if (Object.keys(_qtDraft).length) return false;  // 쓰다 만 묵상 글이 있음
    return true;
  }
  function _reloadWhenSafe(to) {
    if (_reloading) return;
    if (!_safeToReload()) { setTimeout(() => _reloadWhenSafe(to), 4000); return; }
    _reloading = true;
    _noteReload(to);
    location.reload();
  }
  async function _maybeReloadForNewBuild() {
    if (_reloading) return;
    if (_reloadHistory().filter(r => Date.now() - r.t < 300000).length >= 2) {
      console.warn('[업데이트] 자동 새로고침이 반복돼 이번 세션에서는 중단합니다.');
      return;
    }
    const server = await _serverBuild();
    if (!server || server === APP_BUILD) return;
    _reloadWhenSafe(server);
  }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_hadController) _maybeReloadForNewBuild();
  });

  let _swReg = null;
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => {
      _swReg = reg;
      reg.update().catch(() => {});
      const nudge = () => { if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); };
      nudge();
      reg.addEventListener('updatefound', () => {
        if (reg.installing) reg.installing.addEventListener('statechange', nudge);
      });
    })
    .catch(() => {});

  let _lastUpdateCheck = 0;
  function _checkForUpdate() {
    if (!_swReg || document.visibilityState !== 'visible') return;
    if (Date.now() - _lastUpdateCheck < 60000) return;
    _lastUpdateCheck = Date.now();
    _swReg.update().catch(() => {});
  }
  document.addEventListener('visibilitychange', _checkForUpdate);
  window.addEventListener('pageshow', _checkForUpdate);
  window.addEventListener('focus', _checkForUpdate);
}
</script>
